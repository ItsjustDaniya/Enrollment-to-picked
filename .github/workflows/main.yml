name: Refresh Batch Start to Picked date

on:
  schedule:
    # 9:00 AM and 9:00 PM IST == 03:30 and 15:30 UTC
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only two secrets are needed — everything else (Metabase URL, question id,
      # FlyWheel sheet id/tab, output Google Sheet id) is hardcoded in
      # refresh_batch_pipeline.py. The output sheet is written directly via the
      # Sheets API, so there's nothing to commit or upload as an artifact.
      - name: Run refresh
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python refresh_batch_pipeline.py
